# This is a basic workflow to help you get started with Actions
name: phpcs

permissions:
  contents: read


# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch.
  # A change that carries no PHP is left out: the files of the pull request drive phpcs itself, but
  # var-dump-check, parallel-lint and actionlint read the whole tree on every event, and
  # documentation, a module descriptor or an issue template give none of them anything to read.
  # The workflow files stay in: actionlint is here for them.
  push:
    branches: [ master ]
    paths-ignore:
      - '.agents/**'
      - '**.md'
      - '**index.yaml'
      - '.github/ISSUE_TEMPLATE/**'

  pull_request:
    branches: [ master ]
    paths-ignore:
      - '.agents/**'
      - '**.md'
      - '**index.yaml'
      - '.github/ISSUE_TEMPLATE/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


concurrency:
  group: phpcs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # actionlint reads the workflow files themselves: expressions, contexts, action inputs, matrix
  # keys. Pinned, so an upstream release never turns this job red on its own.
  ACTIONLINT_VERSION: 1.7.7

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          # The three tools below parse PHP, they do not run it: an extension listed here only makes
          # the runner build an extension that no check ever loads.
          extensions: mbstring, xml
          tools: php-parallel-lint/php-var-dump-check, parallel-lint, cs2pr, phpcs
      - name: What has to be checked
        # phpcs reads every PHP file of the repository, and that grows with each module added. On a
        # pull request the files of the pull request are enough: what lands on master is checked
        # whole, and so is a change to the ruleset, which can turn a file nobody touched red.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail
          files="${RUNNER_TEMP}/changed-files.txt"
          : > "$files"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # The list is used only when it is known to be complete: the files endpoint answers at
            # most 3000 of them, and a truncated list of a large pull request would read as a small change.
            declared=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files' 2>/dev/null || echo '')
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > "$files" 2>/dev/null || true
            count=$(wc -l < "$files")
          fi
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] || [ -z "$declared" ] || [ "$count" -eq 0 ] || [ "$count" -ne "$declared" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "workflows=yes" >> "$GITHUB_OUTPUT"
            echo "The whole repository is checked."
            exit 0
          fi
          if grep -qE '^(dev/setup/codesniffer/|\.github/workflows/phpcs\.yml$)' "$files"; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "The ruleset itself changed: the whole repository is checked."
          else
            # A pull request that deletes or renames a PHP file lists a path that is gone, and
            # phpcs stops the job on it ("The file ... does not exist"). What left has nothing
            # to check, so only the files still on disk are handed over.
            grep -E '\.php$' "$files" | while IFS= read -r file; do
              [ -f "$file" ] && printf '%s\n' "$file"
            done > changed-php.txt || true
            if [ -s changed-php.txt ]; then
              echo "mode=list" >> "$GITHUB_OUTPUT"
            else
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "No PHP file changed."
            fi
          fi
          if grep -qE '^\.github/(workflows|actions)/' "$files"; then
            echo "workflows=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PHPCS
        if: ${{ steps.scope.outputs.mode == 'all' }}
        run: phpcs -q --report=checkstyle --standard=dev/setup/codesniffer/ruleset.xml --extensions=php --ignore=*/tx/*,*/vendor/*,*/includes/*,dev/tools/phan/* . | cs2pr --graceful-warnings
      - name: Run PHPCS on the files of the pull request
        if: ${{ steps.scope.outputs.mode == 'list' }}
        run: phpcs -q --report=checkstyle --standard=dev/setup/codesniffer/ruleset.xml --extensions=php --ignore=*/tx/*,*/vendor/*,*/includes/*,dev/tools/phan/* --file-list=changed-php.txt | cs2pr --graceful-warnings
      - name: List the third party directories
        # The modules store their libraries into includes/ or vendor/: their code is not this repository's to fix.
        run: |
          find . -type d \( -name vendor -o -name includes \) -not -path './.git/*' > third-party-dirs.txt
          echo "dev/tools/phan/stubs" >> third-party-dirs.txt
      - name: Run VarDump Check
        run: |
          excludes=()
          while IFS= read -r dir; do excludes+=(--exclude "${dir#./}"); done < third-party-dirs.txt
          var-dump-check --extensions php --tracy "${excludes[@]}" .
      - name: Run Parallel Lint
        run: |
          excludes=()
          while IFS= read -r dir; do excludes+=(--exclude "${dir#./}"); done < third-party-dirs.txt
          parallel-lint "${excludes[@]}" .
      - name: One test file per source file under test
        # Only files this pull request ADDS are looked at, so the existing suite never fails the job.
        # Skipped when no PHP file changed: a translation or a workflow cannot add a test file.
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.mode != 'none' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          php .github/scripts/check-test-file-placement.php FETCH_HEAD
      - name: Lint the workflow files
        # shellcheck is left out on purpose: it reports on the shell of every run block, which is
        # not what this step is here for. What it checks is the workflow itself - an expression on
        # a context that does not exist, an input an action does not take, a key YAML reads twice.
        if: ${{ steps.scope.outputs.workflows == 'yes' }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -shellcheck= -pyflakes=
          echo "The workflow files are well formed."
