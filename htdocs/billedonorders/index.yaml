# This is the YAML file to describe the location of a module

packages:
  - modulename: 'BilledOnOrders'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "BilledOnOrders"
      en: "BilledOnOrders"
    description:
      fr: "Module pour afficher le total du facturé et/ou reste à facturer des factures liées à chaque commande dans la liste des commandes clients ou fournisseurs"
      en: "Module to show the amount billed and remain to billed according to linked invoices on the list of customer or supplier orders"
    status: 'enabled'
    created_at: '2017-01-12'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/billedonorders'
    git-branch: 'master'
    git-system: 'github'
    cover: ''
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: ''
