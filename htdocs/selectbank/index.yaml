# This is the YAML file to describe the location of a module

packages:
  - modulename: 'SelectBank'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "Selection banque"
      en: "Select Bank"
    description:
      fr: "Permet la sélection du compte bancaire affiché sur les documents de factures générés"
      en: "Select Bank account to show on invoice generated documents"
    status: 'enabled'
    created_at: '2013-02-23'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/selectbank'
    git-branch: 'master'
    git-system: 'github'
    cover: 'https://raw.githubusercontent.com/DoliCloud/dolimods/master/htdocs/selectbank/img/selectbank.png'
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: 'https://www.dolistore.com/product.php?id=2197'
