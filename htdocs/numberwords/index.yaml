# This is the YAML file to describe the location of a module

packages:
  - modulename: 'NumberWords'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "Number Words"
      en: "Number Words"
    description:
      fr: "Ajoute la possibilité de convertir des montants ou nombres en une valeur écrite en texte alphabétique (seuls quelques languages sont supportés)"
      en: "Add capabilities to convert amounts and numbers into value in full text (only few languages supported)"
    status: 'enabled'
    created_at: '2011-03-03'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/numberwords'
    git-branch: 'master'
    git-system: 'github'
    cover: 'https://raw.githubusercontent.com/DoliCloud/dolimods/master/htdocs/numberwords/img/numberwords.png'
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: ''
