# This is the YAML file to describe the location of a module

packages:
  - modulename: 'RevertInvoice'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "RevertInvoice"
      en: "RevertInvoice"
    description:
      fr: "Create a supplier invoice on an entity each time a customer invoice is created on a dedicated customer."
      en: "Create a supplier invoice on an entity each time a customer invoice is created on a dedicated customer."
    status: 'enabled'
    created_at: '2019-06-06'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/revertinvoice'
    git-branch: 'master'
    git-system: 'github'
    cover: 'https://raw.githubusercontent.com/DoliCloud/dolimods/master/htdocs/revertinvoice/img/revertinvoice.png'
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: ''
