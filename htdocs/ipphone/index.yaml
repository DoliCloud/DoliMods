# This is the YAML file to describe the location of a module

packages:
  - modulename: 'IPPhone'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "IP Phonebook"
      en: "IP Phonebook"
    description:
      fr: "Ajoute un service permettant à un téléphone IP (Cisco, Yealink, Thompson, ...) de lire les contacts Dolibarr pour son carnet d'adresse"
      en: "Offer a service to allow an IP Phone (Cisco, Yealink, Thompson, ...) to read Dolibarr contacts for its phone book"
    status: 'enabled'
    created_at: '2014-10-16'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/ipphone'
    git-branch: 'master'
    git-system: 'github'
    cover: ''
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: ''
