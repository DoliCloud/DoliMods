# This is the YAML file to describe the location of a module

packages:
  - modulename: 'ZipAutoFillFr'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "ZipAutofill FR/BE/CH"
      en: "ZipAutofill FR/BE/CH"
    description:
      fr: "Ajoute tous les codes postaux de France, Belgique, Suisse en base permettant des complétions de code postaux/ville pleinement opérationnel. Ajoute aussi un dictionnaire pour permettre leur édition."
      en: "Add all zip codes for France, Belgium, Switzerland into Dolibarr tables to have full zip/town autocomplete. Add a dictionary to edit them."
    status: 'enabled'
    created_at: '2011-03-03'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/zipautofillfr'
    git-branch: 'master'
    git-system: 'github'
    cover: 'https://raw.githubusercontent.com/DoliCloud/dolimods/master/htdocs/zipautofillfr/img/zipautofillfr.png'
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: 'https://www.dolistore.com/product.php?id=2124'
