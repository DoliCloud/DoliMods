# This is the YAML file to describe the location of a module

packages:
  - modulename: 'SkinColorEditor'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "Skin Editor"
      en: "Skin Editor"
    description:
      fr: "Permet l'édition et la personnalisation des couleurs et polices du thème Eldy"
      en: "Allows to edit and personalise colors and font of skin Eldy"
    status: 'deprecated'
    created_at: '2012-01-15'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/skincoloreditor'
    git-branch: 'master'
    git-system: 'github'
    cover: 'https://raw.githubusercontent.com/DoliCloud/dolimods/master/htdocs/skincoloreditor/img/object_skincoloreditor.png'
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: ''
